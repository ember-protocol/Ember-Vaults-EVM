name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    name: Format Check
    runs-on: piston-2cpu-ubuntu-2402

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check code formatting
        run: yarn format:check

  compile:
    name: Compile Contracts
    runs-on: piston-4cpu-ubuntu-2402

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile contracts
        run: yarn compile

  test:
    name: Run Tests
    runs-on: piston-4cpu-ubuntu-2402

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: yarn coverage
        env:
          DEPLOY_ON: hardhat

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  validate-upgrades:
    name: Validate Upgrade Compatibility
    runs-on: piston-4cpu-ubuntu-2402
    # NOTE: Initially non-blocking. Flip `continue-on-error` to false (and make
    # this job a required check in branch protection) once a few green runs
    # confirm the manifest reconciliation is correct.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # One entry per network with a deployment file and an .openzeppelin manifest.
        # Carried per-entry rather than as nested ternaries in `env:`, which stopped being
        # readable at two networks and does not survive a third.
        #   rpc_env   the variable hardhat.config reads for this network
        #   secret    repo secret preferred for it; absent (e.g. fork PRs) falls back to default_rpc
        include:
          - network: mainnet
            rpc_env: MAINNET_RPC_URL
            secret: MAINNET_RPC_URL
            default_rpc: https://ethereum-rpc.publicnode.com
            fallback_rpcs: https://cloudflare-eth.com,https://rpc.flashbots.net
          - network: pharos
            rpc_env: PHAROS_RPC_URL
            secret: PHAROS_RPC_URL
            default_rpc: https://rpc.pharos.xyz
            fallback_rpcs: https://infra.originstake.com/pharos/evm
          - network: base
            rpc_env: BASE_MAINNET_RPC_URL
            secret: BASE_MAINNET_RPC_URL
            default_rpc: https://mainnet.base.org
            fallback_rpcs: https://base-rpc.publicnode.com,https://base.drpc.org,https://base.meowrpc.com
          - network: monad
            rpc_env: MONAD_RPC_URL
            secret: MONAD_RPC_URL
            default_rpc: https://rpc.monad.xyz
            fallback_rpcs: https://monad.drpc.org
          - network: arbitrum
            rpc_env: ARBITRUM_RPC_URL
            secret: ARBITRUM_RPC_URL
            default_rpc: https://arb1.arbitrum.io/rpc
            fallback_rpcs: https://arbitrum-one-rpc.publicnode.com,https://arbitrum.drpc.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile contracts
        run: yarn compile

      - name: Validate upgrade compatibility against deployed proxies
        # Run without errexit so the loop can inspect $? after a failed yarn
        # invocation and decide whether to retry on the next RPC. GitHub
        # Actions' default `bash -e` would abort on the first non-zero status.
        shell: bash --noprofile --norc {0}
        env:
          DEPLOY_ON: ${{ matrix.network }}
          # Prefer the matching repo secret, then fall back to public read-only RPC(s).
          # All defaults are unauthenticated, so a fork PR still gets a real run.
          PRIMARY_RPC: ${{ secrets[matrix.secret] || matrix.default_rpc }}
          FALLBACK_RPCS: ${{ matrix.fallback_rpcs }}
          NETWORK: ${{ matrix.network }}
          RPC_ENV: ${{ matrix.rpc_env }}
        run: |
          set -u
          if [ -z "${PRIMARY_RPC:-}" ]; then
            echo "❌ PRIMARY_RPC is empty for $NETWORK."
            echo "   Configure the $RPC_ENV repo secret, or set a default_rpc in the job matrix."
            exit 1
          fi
          URLS="$PRIMARY_RPC"
          if [ -n "${FALLBACK_RPCS:-}" ]; then URLS="$URLS,$FALLBACK_RPCS"; fi
          IFS=',' read -ra LIST <<< "$URLS"
          ATTEMPT=0
          for url in "${LIST[@]}"; do
            ATTEMPT=$((ATTEMPT+1))
            echo "::group::RPC attempt $ATTEMPT: $url"
            # `env NAME=value` so the variable hardhat.config reads for this network is set by
            # name from the matrix, rather than a case arm that has to be extended per chain.
            env "$RPC_ENV=$url" yarn ci:validate-upgrades --network "$NETWORK"
            STATUS=$?
            echo "::endgroup::"
            # Exit codes from the script:
            #   0 — all proxies valid (we're done)
            #   1 — validation failure (real bug; do NOT retry on another RPC)
            #   2 — RPC probe failure (retry on next fallback)
            if [ $STATUS -eq 0 ] || [ $STATUS -eq 1 ]; then
              exit $STATUS
            fi
            echo "RPC $url unreachable (exit $STATUS); trying next endpoint..."
          done
          echo "❌ All RPC endpoints unreachable for $NETWORK"
          exit 1

